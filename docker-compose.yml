version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: darya-db
    environment:
      POSTGRES_DB: darya
      POSTGRES_USER: darya_user
      POSTGRES_PASSWORD: darya_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U darya_user -d darya"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=darya;Username=darya_user;Password=darya_password
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=https://api.darya-app.space
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data: