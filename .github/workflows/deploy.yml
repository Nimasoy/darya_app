name: Darya CI/CD Production Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # 1. Test C# Backend
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    - name: Restore dependencies
      run: dotnet restore server/server.csproj
    - name: Build server
      run: dotnet build server/server.csproj --no-restore -c Release
    
    # 2. Test React Frontend PWA
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: client/package-lock.json
    - name: Install client dependencies
      run: npm ci --prefix client
    - name: Compile frontend PWA
      run: npm run build --prefix client

  build-and-publish:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # 3. Build & Publish Backend Image
    - name: Build & Push Backend
      uses: docker/build-push-action@v5
      with:
        context: ./server
        file: ./server/Dockerfile
        push: true
        tags: ghcr.io/nimasoy/darya-backend:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # 4. Build & Push Frontend Image
    - name: Build & Push Frontend
      uses: docker/build-push-action@v5
      with:
        context: ./client
        file: ./client/Dockerfile
        build-args: |
          VITE_API_URL=https://api.darya-app.space
        push: true
        tags: ghcr.io/nimasoy/darya-frontend:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    needs: build-and-publish
    runs-on: ubuntu-latest
    steps:
    - name: Execute deployment commands via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST_IP }}
        username: ${{ secrets.HOST_USERNAME }}
        key: ${{ secrets.HOST_SSH_KEY }}
        script: |
          mkdir -p ~/darya-app
          cd ~/darya-app
          # Retrieve the latest docker-compose.prod.yml file from the repository
          curl -sSL https://raw.githubusercontent.com/${{ github.repository }}/main/docker-compose.prod.yml -o docker-compose.prod.yml
          
          # Pull latest prebuilt images from GHCR
          docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
          docker compose -f docker-compose.prod.yml pull
          
          # Spin up containers
          export TELEGRAM_BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          export TELEGRAM_API_BASE_URL="https://darya-telegram-proxy.nimarezaie41203.workers.dev"
          docker compose -f docker-compose.prod.yml up -d --remove-orphans
