name: Darya CI/CD Production Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  # 1. Cloud verification & tests
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore & Test Backend Build
        run: |
          dotnet restore server/server.csproj
          dotnet build server/server.csproj --no-restore -c Release

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Dependencies & Test Frontend Build
        run: |
          npm ci --prefix client
          npm run build --prefix client

  # 2. Deploy directly on your Proxmox server via Self-Hosted Runner
  deploy:
    needs: build-and-test
    runs-on: self-hosted
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_API_BASE_URL: "https://darya-telegram-proxy.nimarezaie41203.workers.dev"
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Containers
        run: |
          export TELEGRAM_BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          export TELEGRAM_API_BASE_URL="https://darya-telegram-proxy.nimarezaie41203.workers.dev"
          
          # Clean up any empty directory created by docker bind mount
          if [ -d "./server/firebase-service-account.json" ]; then
            rm -rf ./server/firebase-service-account.json
          fi

          # Copy persistent firebase-service-account.json from host if present
          if [ -f "/home/theo/darya-app/server/firebase-service-account.json" ]; then
            cp "/home/theo/darya-app/server/firebase-service-account.json" ./server/firebase-service-account.json
            echo "Copied firebase-service-account.json from /home/theo/darya-app/server/"
          elif [ -f "$HOME/darya-app/server/firebase-service-account.json" ]; then
            cp "$HOME/darya-app/server/firebase-service-account.json" ./server/firebase-service-account.json
            echo "Copied firebase-service-account.json from $HOME/darya-app/server/"
          fi

          docker compose -p darya down --remove-orphans || true
          docker compose down --remove-orphans || true
          docker rm -f darya-db || true
          docker compose build --no-cache
          docker compose up -d